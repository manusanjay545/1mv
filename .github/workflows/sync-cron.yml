name: 15-Minute Sync Automation

on:
  schedule:
    # Runs every 15 minutes completely free on GitHub Actions
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger MovieVault Sync Endpoint
        run: |
          TARGET_URL="${{ secrets.SITE_URL || secrets.VERCEL_PROJECT_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "::notice ::SITE_URL secret is not set yet in GitHub Repository Secrets. Set SITE_URL to https://your-app.vercel.app to enable this automated runner."
            exit 0
          fi

          echo "Triggering sync on ${TARGET_URL}/api/cron/synchronize..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "${TARGET_URL}/api/cron/synchronize" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Synchronization completed successfully."
          else
            echo "::warning ::Sync responded with HTTP $HTTP_CODE: $BODY"
          fi
